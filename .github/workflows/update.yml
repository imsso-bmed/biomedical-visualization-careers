name: Update public opportunities
on:
  schedule:
    - cron: '17 0 * * *' # UTC, 09:17 KST (may be delayed)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-opportunities
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch public job boards
        run: python scripts/collect.py
      - name: Validate data
        run: python scripts/validate.py
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public opportunities'
            git push
          fi
