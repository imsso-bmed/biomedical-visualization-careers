name: Collect jobs and deploy GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 0 * * *' # 09:17 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careers-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh official job boards
        id: collect
        continue-on-error: true
        run: python scripts/collect.py
      - name: Validate published data
        run: python scripts/validate.py
      - name: Save job history
        if: steps.collect.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public jobs'
            git push
          fi
      - name: Prepare public site
        run: |
          mkdir public
          cp index.html app.js .nojekyll public/
          cp -r data public/
          mkdir public/config
          cp config/sources.json public/config/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Report collector failure
        if: steps.collect.outcome == 'failure'
        run: echo '::warning::All boards failed. Publishing the previous snapshot.'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
